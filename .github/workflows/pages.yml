# ينشر التطبيق على GitHub Pages تلقائيًا مع كل دفعة إلى main.
# التطبيق ملفات ثابتة بلا خطوة بناء، فالمهمة كلها: خذ المجلد كما هو وانشره.
# actions/configure-pages مع enablement: true يفعّل Pages بنفسه إن لم يكن مفعّلًا.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
